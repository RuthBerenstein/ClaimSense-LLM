base_model: meta-llama/Llama-3.1-8B-Instruct
train_file: data/train.jsonl
eval_file: data/test.jsonl
output_dir: outputs/claimsense-lora
max_len: 768
epochs: 3
batch_size: 2
grad_accum: 8
lr: 2.0e-4
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
